# WebSocket upgrade passthrough: 'upgrade' only when the client asked for it,
# 'close' otherwise — sending a bare Upgrade header on normal requests breaks
# keepalive with some upstreams.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Plain HTTP exists only to redirect. Put the real certificate in nginx/certs/.
server {
    listen 80;
    server_name _;

    # Certbot webroot, if you use it.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # XML exports of the full dataset run to gigabytes and stream chunked.
    client_max_body_size 16m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    # Docker's embedded DNS. Upstream names are resolved per request via the variables
    # below instead of once at startup — otherwise recreating a container hands it a new
    # IP and nginx keeps proxying to the old one until it is restarted (502s).
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Nuxt UI serves its own icon bundles from /api/_nuxt_icon — that path belongs to the
    # frontend, not to FastAPI. It must be matched before the generic /api/ rule below,
    # or every icon on every page 404s.
    location ^~ /api/_nuxt_icon/ {
        set $icon_upstream http://frontend:3000;
        proxy_pass $icon_upstream;
    }

    location /api/ {
        set $api_upstream http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
    }

    location / {
        set $ui_upstream http://frontend:3000;
        proxy_pass $ui_upstream;
    }
}
