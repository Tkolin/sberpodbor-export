name: sberpodbor

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sberpodbor}
      POSTGRES_USER: ${POSTGRES_USER:-sberpodbor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # The dataset is import-heavy and read-mostly afterwards.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_wal_size=4GB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sberpodbor} -d ${POSTGRES_DB:-sberpodbor}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Not published to the host in production; reach it through `docker compose exec`.
    expose:
      - "5432"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sberpodbor}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sberpodbor}
      SP_JWT_SECRET: ${SP_JWT_SECRET:?SP_JWT_SECRET is required}
      SP_ENCRYPTION_KEY: ${SP_ENCRYPTION_KEY:?SP_ENCRYPTION_KEY is required}
      SP_BOOTSTRAP_ADMIN_EMAIL: ${SP_BOOTSTRAP_ADMIN_EMAIL:-admin@local}
      SP_BOOTSTRAP_ADMIN_PASSWORD: ${SP_BOOTSTRAP_ADMIN_PASSWORD:-}
      SP_CORS_ORIGINS: ${SP_CORS_ORIGINS:-}
      SP_EXPORT_DIR: /exports
      SP_MEDIA_DIR: /media
    volumes:
      - ./exports:/exports
      - ./media:/media
      # Verified snapshot, not the live file — the importer must never touch the original.
      - ./backups:/legacy:ro
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    expose:
      - "8000"

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
    environment:
      SP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sberpodbor}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sberpodbor}
      SP_ENCRYPTION_KEY: ${SP_ENCRYPTION_KEY}
      SP_JWT_SECRET: ${SP_JWT_SECRET}
      SP_EXPORT_DIR: /exports
      SP_MEDIA_DIR: /media
      SP_MEDIA_CONCURRENCY: ${SP_MEDIA_CONCURRENCY:-24}
      SP_LANE_CONCURRENCY: ${SP_LANE_CONCURRENCY:-14}
      SP_MIN_INTERVAL_MS: ${SP_MIN_INTERVAL_MS:-100}
      SP_REQ_TIMEOUT_S: ${SP_REQ_TIMEOUT_S:-30}
    volumes:
      - ./exports:/exports
      - ./media:/media
    # The scheduler is a singleton: one worker holds a Postgres advisory lock.
    command: python -m app.worker.main

  frontend:
    build:
      context: ./frontend
      args:
        NUXT_PUBLIC_API_BASE: /api
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NUXT_PUBLIC_API_BASE: /api
      NITRO_PORT: "3000"
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "${SP_HTTP_PORT:-80}:80"
      - "${SP_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  pgdata:
